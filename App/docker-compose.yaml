services:

  postgres:

    image: postgres:17

    container_name: postgres_api

    restart: always

    ports:
      - "${DB_PORT}:5432"

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/config/database-init.sql:/docker-entrypoint-initdb.d/database-init.sql

volumes:

  postgres_data: